<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <meta name="theme-color" content="#111827" />
    <title>午後三時、夏の果。</title>
    <style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#0d0d0d}
#app{
  position:fixed;left:50%;top:50%;
  width:1280px;height:720px;
  transform-origin:center center;
  background:#0d0d0d;
}
#app canvas{display:block;width:1280px!important;height:720px!important}
    </style>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/client/src/branding.ts"></script>
    <script type="module" src="/client/src/main.ts"></script>
    <script type="module" src="/client/src/player-depth.ts"></script>
    <script>
(function(){
  function fitGame(){
    var app=document.getElementById("app");
    if(!app)return;
    var scale=Math.min(1, window.innerWidth/1280, window.innerHeight/720);
    app.style.transform="translate(-50%,-50%) scale("+scale+")";
  }
  window.addEventListener("resize",fitGame);
  fitGame();
})();
    </script>
  </body>
</html>
