name: Apply beta 0.52 Yunagicho audio

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/patch-v052-yunagicho-audio.yml'

permissions:
  contents: write

jobs:
  patch:
    if: github.event.head_commit.message == 'Stage beta 0.52 Yunagicho audio patch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Download Freesound preview for sound 587370
        shell: python
        run: |
          import html, pathlib, re, subprocess, urllib.request
          page_url='https://freesound.org/people/jordir/sounds/587370/'
          req=urllib.request.Request(page_url, headers={'User-Agent':'Mozilla/5.0'})
          page=urllib.request.urlopen(req, timeout=30).read().decode('utf-8','replace')
          page=html.unescape(page).replace('\\/','/')
          patterns=[
            r'https://cdn\.freesound\.org/previews/[^\"\'<> ]+\.mp3',
            r'//cdn\.freesound\.org/previews/[^\"\'<> ]+\.mp3',
          ]
          urls=[]
          for pat in patterns:
            urls += re.findall(pat,page)
          urls=[('https:'+u if u.startswith('//') else u) for u in urls]
          urls=list(dict.fromkeys(urls))
          if not urls:
            raise SystemExit('Freesound MP3 preview URL not found')
          # Prefer HQ preview when both HQ/LQ are present.
          urls.sort(key=lambda u: ('-hq.mp3' not in u, '-lq.mp3' in u))
          url=urls[0]
          print('Using preview:',url)
          out=pathlib.Path('public/audio/yunagicho-perves-village-587370.mp3')
          out.parent.mkdir(parents=True,exist_ok=True)
          req=urllib.request.Request(url, headers={'User-Agent':'Mozilla/5.0'})
          out.write_bytes(urllib.request.urlopen(req, timeout=120).read())
          if out.stat().st_size < 500_000:
            raise SystemExit(f'preview unexpectedly small: {out.stat().st_size}')
          print('Downloaded bytes:',out.stat().st_size)

      - name: Patch Yunagicho audio and credits
        shell: python
        run: |
          from pathlib import Path

          def replace_once(path, old, new):
              p=Path(path); text=p.read_text()
              if old not in text:
                  raise SystemExit(f'pattern missing in {path}: {old[:100]!r}')
              p.write_text(text.replace(old,new,1))

          main=Path('client/src/main.ts')
          text=main.read_text()
          old='''private readonly audioAssets: Record<string,string> = {\n    "convenience-night-ambience": "/audio/convenience-night-ambience-17064.mp3"\n  };'''
          new='''private readonly audioAssets: Record<string,string> = {\n    "yunagicho-perves-village": "/audio/yunagicho-perves-village-587370.mp3",\n    "convenience-night-ambience": "/audio/convenience-night-ambience-17064.mp3"\n  };'''
          if old not in text: raise SystemExit('audioAssets pattern missing')
          text=text.replace(old,new,1)
          old_map='''yunagicho: {\n      name:"夕凪町", texture:"yunagicho-field", quiz:false,\n      audio:{ bgmKey:null, ambienceKeys:[] }\n    }'''
          new_map='''yunagicho: {\n      name:"夕凪町", texture:"yunagicho-field", quiz:false,\n      audio:{ bgmKey:"yunagicho-perves-village", ambienceKeys:[] }\n    }'''
          if old_map not in text: raise SystemExit('Yunagicho map audio pattern missing')
          text=text.replace(old_map,new_map,1)

          old_credit='''    credits.append(creditTitle,creditLink);\n    box.appendChild(credits);'''
          new_credit='''    const yunagiCreditTitle=document.createElement("div");\n    yunagiCreditTitle.style.marginTop="8px";\n    yunagiCreditTitle.textContent="BGM: Perves Ambient Mountains Distant Small Village — jordir / Freesound";\n    const yunagiCreditLink=document.createElement("a");\n    yunagiCreditLink.href="https://freesound.org/people/jordir/sounds/587370/";\n    yunagiCreditLink.target="_blank";\n    yunagiCreditLink.rel="noopener noreferrer";\n    yunagiCreditLink.textContent="Freesound";\n    Object.assign(yunagiCreditLink.style,{color:"#fff",opacity:".9"} as Partial<CSSStyleDeclaration>);\n    credits.append(creditTitle,creditLink,yunagiCreditTitle,yunagiCreditLink);\n    box.appendChild(credits);'''
          if old_credit not in text: raise SystemExit('credit anchor missing')
          text=text.replace(old_credit,new_credit,1)
          text=text.replace('β 0.51','β 0.52')
          main.write_text(text)

          replace_once('package.json','"version": "0.51.0-beta.1"','"version": "0.52.0-beta.1"')

          for path in ['README.md','SPEC.md']:
              p=Path(path); d=p.read_text().replace('β 0.51','β 0.52')
              if 'Perves Ambient Mountains Distant Small Village' not in d:
                  d += '\n\n- 夕凪町BGM: **Perves Ambient Mountains Distant Small Village** — jordir / Freesound\n- Source: https://freesound.org/people/jordir/sounds/587370/\n- License: CC0\n'
              p.write_text(d)

      - name: Install dependencies
        run: npm install
      - name: Build and validate
        run: npm run build
      - name: Server syntax checks
        run: |
          node --check server/server.js
          node --check server/shared-backend.js
      - name: Verify requested behavior independently
        run: |
          grep -F '"yunagicho-perves-village": "/audio/yunagicho-perves-village-587370.mp3"' client/src/main.ts
          grep -F 'audio:{ bgmKey:"yunagicho-perves-village", ambienceKeys:[] }' client/src/main.ts
          grep -F 'Perves Ambient Mountains Distant Small Village — jordir / Freesound' client/src/main.ts
          grep -F 'https://freesound.org/people/jordir/sounds/587370/' client/src/main.ts README.md SPEC.md
          test -s public/audio/yunagicho-perves-village-587370.mp3
          ! grep -R 'SUPABASE_SERVICE_ROLE_KEY' client dist || exit 1
      - name: Commit beta 0.52
        run: |
          git config user.name 'keisasaki3'
          git config user.email '61055342+keisasaki3@users.noreply.github.com'
          git add client/src/main.ts public/audio/yunagicho-perves-village-587370.mp3 package.json package-lock.json README.md SPEC.md
          git commit -m 'Add Yunagicho Freesound BGM beta 0.52'
          git push origin HEAD:main
