name: Apply beta 0.53 profile volume fixed viewport shrine audio

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/patch-v053-profile-volume-fixed-shrine.yml'

permissions:
  contents: write

jobs:
  patch:
    if: github.event.head_commit.message == 'Stage beta 0.53 profile volume fixed viewport shrine audio patch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Download Freesound preview for shrine sound 275634
        run: |
          set -euo pipefail
          curl -L --fail --max-time 30 -A 'Mozilla/5.0' 'https://freesound.org/people/kvgarlic/sounds/275634/' -o /tmp/freesound.html
          python - <<'PY' > /tmp/preview-url.txt
          import html,re
          page=html.unescape(open('/tmp/freesound.html',encoding='utf-8',errors='replace').read()).replace('\\/','/')
          pats=[r'https://cdn\.freesound\.org/previews/[^"\'<> ]+\.mp3',r'//cdn\.freesound\.org/previews/[^"\'<> ]+\.mp3']
          urls=[]
          for p in pats: urls += re.findall(p,page)
          urls=[('https:'+u if u.startswith('//') else u) for u in urls]
          urls=list(dict.fromkeys(urls))
          if not urls: raise SystemExit('Freesound MP3 preview URL not found')
          hq=[u for u in urls if '-hq.mp3' in u]
          lq=[u for u in urls if '-lq.mp3' in u]
          print((hq or lq or urls)[0])
          PY
          PREVIEW_URL="$(cat /tmp/preview-url.txt)"
          echo "Using preview: $PREVIEW_URL"
          mkdir -p public/audio
          curl -L --fail --max-time 90 -A 'Mozilla/5.0' "$PREVIEW_URL" -o public/audio/komorebi-cicadas-birds-275634.mp3
          test "$(wc -c < public/audio/komorebi-cicadas-birds-275634.mp3)" -gt 100000

      - name: Patch requested UI audio and viewport behavior
        shell: python
        run: |
          from pathlib import Path

          def must_replace(path, old, new, count=1):
              p=Path(path)
              text=p.read_text()
              if old not in text:
                  raise SystemExit(f'pattern missing in {path}: {old[:140]!r}')
              p.write_text(text.replace(old,new,count))

          main=Path('client/src/main.ts')
          text=main.read_text()

          # Restore persistent master volume.
          old='''  private transitionLock = false;\n  private activeMapBgm?: Phaser.Sound.BaseSound;\n  private activeMapAmbience: Phaser.Sound.BaseSound[] = [];'''
          new='''  private transitionLock = false;\n  private activeMapBgm?: Phaser.Sound.BaseSound;\n  private activeMapAmbience: Phaser.Sound.BaseSound[] = [];\n  private masterVolume = Math.min(1, Math.max(0, Number(localStorage.getItem("summer-end-3pm-master-volume") ?? "1")));'''
          if old not in text: raise SystemExit('audio state anchor missing')
          text=text.replace(old,new,1)

          old='''  private readonly audioAssets: Record<string,string> = {\n    "yunagicho-perves-village": "/audio/yunagicho-perves-village-587370.mp3",\n    "convenience-night-ambience": "/audio/convenience-night-ambience-17064.mp3"\n  };'''
          new='''  private readonly audioAssets: Record<string,string> = {\n    "yunagicho-perves-village": "/audio/yunagicho-perves-village-587370.mp3",\n    "komorebi-cicadas-birds": "/audio/komorebi-cicadas-birds-275634.mp3",\n    "convenience-night-ambience": "/audio/convenience-night-ambience-17064.mp3"\n  };'''
          if old not in text: raise SystemExit('audioAssets anchor missing')
          text=text.replace(old,new,1)

          old='''    komorebi: {\n      name:"木漏れ日神社", texture:"komorebi-field", quiz:false,\n      audio:{ bgmKey:null, ambienceKeys:[] }\n    },'''
          new='''    komorebi: {\n      name:"木漏れ日神社", texture:"komorebi-field", quiz:false,\n      audio:{ bgmKey:"komorebi-cicadas-birds", ambienceKeys:[] }\n    },'''
          if old not in text: raise SystemExit('komorebi map audio anchor missing')
          text=text.replace(old,new,1)

          old='''      this.activeMapBgm=this.sound.add(config.bgmKey,{loop:true,volume:1});\n      this.activeMapBgm.play();'''
          new='''      this.activeMapBgm=this.sound.add(config.bgmKey,{loop:true,volume:this.masterVolume});\n      this.activeMapBgm.play();'''
          if old not in text: raise SystemExit('bgm volume anchor missing')
          text=text.replace(old,new,1)
          old='''      const sound=this.sound.add(key,{loop:true,volume:1});'''
          new='''      const sound=this.sound.add(key,{loop:true,volume:this.masterVolume});'''
          if old not in text: raise SystemExit('ambience volume anchor missing')
          text=text.replace(old,new,1)

          # User-requested shared profile wording.
          old='''    setMessage(storedRace ? "共通プロフィールを確認して散歩を始めます。" : "最初に共通種族を選んでください。");'''
          new='''    setMessage("なつめポータル共通のプロフィールです");'''
          if old not in text: raise SystemExit('profile wording anchor missing')
          text=text.replace(old,new,1)

          # Add master volume to OPTIONS immediately after coordinate toggle.
          anchor='''    box.append(heading,coordsLabel);\n\n    let statusSelect:HTMLSelectElement|undefined;'''
          volume='''    box.append(heading,coordsLabel);\n\n    const volumeLabel=document.createElement("label");\n    Object.assign(volumeLabel.style,{display:"block",marginTop:"18px",marginBottom:"6px"} as Partial<CSSStyleDeclaration>);\n    const volumeText=document.createElement("span");\n    const volumeValue=document.createElement("span");\n    volumeText.textContent="音量";\n    volumeValue.textContent=` ${Math.round(this.masterVolume*100)}%`;\n    volumeLabel.append(volumeText,volumeValue);\n    const volume=document.createElement("input");\n    volume.type="range";\n    volume.min="0";\n    volume.max="100";\n    volume.step="1";\n    volume.value=String(Math.round(this.masterVolume*100));\n    Object.assign(volume.style,{width:"100%",margin:"0 0 2px"} as Partial<CSSStyleDeclaration>);\n    volume.addEventListener("input",()=>{\n      this.masterVolume=Math.min(1,Math.max(0,Number(volume.value)/100));\n      volumeValue.textContent=` ${Math.round(this.masterVolume*100)}%`;\n      localStorage.setItem("summer-end-3pm-master-volume",String(this.masterVolume));\n      this.activeMapBgm?.setVolume(this.masterVolume);\n      for(const sound of this.activeMapAmbience) sound.setVolume(this.masterVolume);\n    });\n    box.append(volumeLabel,volume);\n\n    let statusSelect:HTMLSelectElement|undefined;'''
          if anchor not in text: raise SystemExit('options volume anchor missing')
          text=text.replace(anchor,volume,1)

          # Add shrine credit after Yunagicho credit.
          anchor='''    Object.assign(yunagiCreditLink.style,{color:"#fff",opacity:".9"} as Partial<CSSStyleDeclaration>);\n    credits.append(creditTitle,creditLink,yunagiCreditTitle,yunagiCreditLink);'''
          credit='''    Object.assign(yunagiCreditLink.style,{color:"#fff",opacity:".9"} as Partial<CSSStyleDeclaration>);\n    const komorebiCreditTitle=document.createElement("div");\n    komorebiCreditTitle.style.marginTop="8px";\n    komorebiCreditTitle.textContent="BGM: Cicadas + Birds — kvgarlic / Freesound";\n    const komorebiCreditLink=document.createElement("a");\n    komorebiCreditLink.href="https://freesound.org/people/kvgarlic/sounds/275634/";\n    komorebiCreditLink.target="_blank";\n    komorebiCreditLink.rel="noopener noreferrer";\n    komorebiCreditLink.textContent="Freesound";\n    Object.assign(komorebiCreditLink.style,{color:"#fff",opacity:".9"} as Partial<CSSStyleDeclaration>);\n    credits.append(creditTitle,creditLink,yunagiCreditTitle,yunagiCreditLink,komorebiCreditTitle,komorebiCreditLink);'''
          if anchor not in text: raise SystemExit('shrine credit anchor missing')
          text=text.replace(anchor,credit,1)

          text=text.replace('β 0.52','β 0.53')
          main.write_text(text)

          # Fixed 1280x720 canvas: never scale down with browser size.
          index=Path('index.html')
          html=index.read_text()
          old='''html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#0d0d0d}\n#app{\n  position:fixed;left:50%;top:50%;\n  width:1280px;height:720px;\n  transform-origin:center center;\n  background:#0d0d0d;\n}\n#app canvas{display:block;width:1280px!important;height:720px!important}'''
          new='''html,body{margin:0;width:100%;height:100%;min-width:1280px;min-height:720px;overflow:auto;background:#0d0d0d}\nbody{position:relative}\n#app{\n  position:absolute;left:50%;top:50%;\n  width:1280px;height:720px;\n  transform:translate(-50%,-50%);\n  background:#0d0d0d;\n}\n#app canvas{display:block;width:1280px!important;height:720px!important}'''
          if old not in html: raise SystemExit('fixed viewport CSS anchor missing')
          html=html.replace(old,new,1)
          old_script='''    <script>\n(function(){\n  function fitGame(){\n    var app=document.getElementById("app");\n    if(!app)return;\n    var scale=Math.min(1, window.innerWidth/1280, window.innerHeight/720);\n    app.style.transform="translate(-50%,-50%) scale("+scale+")";\n  }\n  window.addEventListener("resize",fitGame);\n  fitGame();\n})();\n    </script>\n'''
          if old_script not in html: raise SystemExit('fitGame script anchor missing')
          html=html.replace(old_script,'',1)
          index.write_text(html)

          # Version + docs.
          pkg=Path('package.json')
          p=pkg.read_text()
          if '"version": "0.52.0-beta.1"' not in p: raise SystemExit('package version anchor missing')
          pkg.write_text(p.replace('"version": "0.52.0-beta.1"','"version": "0.53.0-beta.1"',1))
          for path in ['README.md','SPEC.md']:
              f=Path(path); d=f.read_text().replace('β 0.52','β 0.53')
              if 'kvgarlic/sounds/275634' not in d:
                  d += '\n\n- 木漏れ日神社BGM: **Cicadas + Birds** — kvgarlic / Freesound\n- Source: https://freesound.org/people/kvgarlic/sounds/275634/\n'
              f.write_text(d)

      - name: Install dependencies
        run: npm install
      - name: Build and validate
        run: npm run build
      - name: Server syntax checks
        run: |
          node --check server/server.js
          node --check server/shared-backend.js
      - name: Verify requested behavior independently
        run: |
          grep -F 'setMessage("なつめポータル共通のプロフィールです");' client/src/main.ts
          grep -F 'summer-end-3pm-master-volume' client/src/main.ts
          grep -F 'volume.type="range"' client/src/main.ts
          grep -F '"komorebi-cicadas-birds": "/audio/komorebi-cicadas-birds-275634.mp3"' client/src/main.ts
          grep -F 'audio:{ bgmKey:"komorebi-cicadas-birds", ambienceKeys:[] }' client/src/main.ts
          grep -F 'https://freesound.org/people/kvgarlic/sounds/275634/' client/src/main.ts README.md SPEC.md
          grep -F 'min-width:1280px;min-height:720px;overflow:auto' index.html
          ! grep -F 'fitGame' index.html
          test -s public/audio/komorebi-cicadas-birds-275634.mp3
          ! grep -R 'SUPABASE_SERVICE_ROLE_KEY' client dist || exit 1
      - name: Commit beta 0.53
        run: |
          git config user.name 'keisasaki3'
          git config user.email '61055342+keisasaki3@users.noreply.github.com'
          git add client/src/main.ts index.html public/audio/komorebi-cicadas-birds-275634.mp3 package.json package-lock.json README.md SPEC.md
          git commit -m 'Restore volume fix viewport and add shrine BGM beta 0.53'
          git push origin HEAD:main
